name: CI — DocuMind

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Lint + Install ─────────────────────────────────────────────────
  backend-lint:
    name: Python Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=__pycache__,uploads,faiss_store

  # ── Frontend Build ─────────────────────────────────────────────────────────
  frontend-build:
    name: React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check / Build
        run: npm run build

  # ── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t documind-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t documind-frontend:ci ./frontend
